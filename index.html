<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bomboclat</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    .stage { position: fixed; inset: 0; cursor: grab; }
    .stage .layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .stage .key { visibility: hidden; }
    .stage .key.on { visibility: visible; }
  </style>
</head>
<body>
  <canvas id="cat"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
